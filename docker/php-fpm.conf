[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

; === OPTIMIZACIÓN PARA PERFORMANCE ===
; pm = dynamic permite escalar workers según demanda
pm = dynamic

; Máximo de procesos hijos (workers concurrentes)
pm.max_children = 20

; Workers iniciales al arrancar
pm.start_servers = 5

; Mínimo de workers en espera (idle)
pm.min_spare_servers = 3

; Máximo de workers en espera
pm.max_spare_servers = 10

; Peticiones que un worker atiende antes de reciclarse (previene memory leaks)
pm.max_requests = 500

; Log de workers lentos (más de 5 segundos)
request_slowlog_timeout = 5s
slowlog = /var/log/php-fpm-slow.log
